<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于我</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-grad: linear-gradient(120deg, #f3e8ff, #e0f3ff);
      --star-opacity: 0;
      --text-main: #2b3a67;
      --text-sub: #7a8599;
      --link: #4d8bff;
      --link-hover: #2f6bff;
      --theme-btn-bg: rgba(255,255,255,.7);
    }

    body.dark {
      --bg-grad: linear-gradient(120deg, #0d1321, #1a1f3a, #10182b);
      --star-opacity: 0.8;
      --text-main: #e8ecff;
      --text-sub: #7d8ab0;
      --link: #8ab5ff;
      --link-hover: #c6dbff;
      --theme-btn-bg: rgba(255,255,255,.12);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      font-family: "楷体", "Microsoft YaHei", sans-serif;
      background: var(--bg-grad);
      background-size: 400% 400%;
      animation: bgMove 20s ease infinite;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: var(--star-opacity);
      animation: twinkle 4s ease-in-out infinite;
      transition: opacity .5s;
    }
    @keyframes twinkle {
      0%, 100% { opacity: calc(var(--star-opacity) * .2); transform: scale(1); }
      50%      { opacity: var(--star-opacity); transform: scale(1.4); }
    }

    h1 {
      font-weight: 300;
      letter-spacing: 10px;
    }
    p { color: var(--text-sub); letter-spacing: 2px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); }

    .theme-btn {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 2;
      width: 48px; height: 48px;
      border: none;
      border-radius: 50%;
      background: var(--theme-btn-bg);
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .theme-btn:hover { transform: scale(1.15); }
  </style>
</head>
<body>
  <div class="star" style="top: 15%; left: 30%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 35%; left: 75%; width: 2px; height: 2px; animation-delay: 1s;"></div>
  <div class="star" style="top: 65%; left: 20%; width: 2px; height: 2px; animation-delay: 2s;"></div>
  <div class="star" style="top: 80%; left: 60%; width: 3px; height: 3px; animation-delay: 0.5s;"></div>

  <button class="theme-btn" id="themeBtn" title="切换风格">🌙</button>

  <h1>关于我</h1>
  <p>自我介绍还在制作中……敬请期待 ✨</p>
  <a href="index.html">← 返回首页</a>

  <script>
    const btn = document.getElementById('themeBtn');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      btn.textContent = '☀️';
    }
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      btn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
