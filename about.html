<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>关于我</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      font-family: "楷体", "Microsoft YaHei", sans-serif;
      background: linear-gradient(120deg, #0d1321, #1a1f3a, #10182b);
      background-size: 400% 400%;
      animation: bgMove 20s ease infinite;
      color: #e8ecff;
      overflow: hidden;
      position: relative;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50%      { opacity: 0.8;  transform: scale(1.4); }
    }

    h1 {
      font-weight: 300;
      letter-spacing: 10px;
      text-shadow: 0 0 10px rgba(140, 170, 255, 0.5);
    }
    p { color: #7d8ab0; letter-spacing: 2px; }
    a { color: #8ab5ff; text-decoration: none; }
    a:hover { color: #c6dbff; }
  </style>
</head>
<body>
  <div class="star" style="top: 15%; left: 30%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 35%; left: 75%; width: 2px; height: 2px; animation-delay: 1s;"></div>
  <div class="star" style="top: 65%; left: 20%; width: 2px; height: 2px; animation-delay: 2s;"></div>
  <div class="star" style="top: 80%; left: 60%; width: 3px; height: 3px; animation-delay: 0.5s;"></div>

  <h1>关于我</h1>
  <p>自我介绍还在制作中……敬请期待 ✨</p>
  <a href="index.html">← 返回首页</a>
</body>
</html>
